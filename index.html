<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3jsgame — ARPG Prototype</title>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>

      <!-- HUD overlay (HTML, not canvas) -->
      <div id="hud">
        <div id="hud-help" class="panel">
          <strong>ARPG Prototype — Phase 1 Combat</strong>
          <div><b>Left-click</b> monster: attack-move</div>
          <div><b>Left-click</b> ground: move · <b>Right-click</b>: stop</div>
          <div><b>1</b>: Fireball · <b>Q</b>: potion · <b>WASD</b>: move</div>
          <div><b>Wheel</b>: zoom</div>
        </div>
        <div id="hud-stats" class="panel">
          <div>Lv <b id="stat-level">1</b> · kills: <span id="stat-kills">0</span></div>
          <div>pos: <span id="stat-pos">0, 0</span></div>
          <div>state: <span id="stat-state">idle</span></div>
          <div>fps: <span id="stat-fps">--</span></div>
        </div>

        <div id="hud-toast"></div>

        <div id="hud-bottom">
          <div id="hp-bar"><div id="hp-fill"></div><span id="hp-text">100/100</span></div>
          <div id="xp-bar"><div id="xp-fill"></div></div>
          <div id="hud-skillbar">
            <div class="skill" title="Left-click monster = auto attack">⚔️</div>
            <div class="skill" title="Fireball (1) — 2x damage">1<div id="cd-fire" class="cd"></div></div>
            <div class="skill" id="skill-potion" title="Potion (Q) — heal 45%">Q</div>
          </div>
        </div>

        <div id="death-overlay" style="display:none">
          <div>
            <h1>YOU DIED</h1>
            <p id="death-sub">Respawn in 2.5s</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
